[project]
name = "cc-leadgen"
version = "0.1.0"
description = "Client Compass — Automated Lead Generation Engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "celery>=5.4",
    "redis>=5.0",
    "structlog>=24.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "playwright==1.59.0",  # pinned 2026-07-02 — must match browser version baked into image,
    "beautifulsoup4>=4.12",
    "googlemaps>=4.10",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "psycopg>=3.2",
    "weasyprint>=61.0",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
target-version = "312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
